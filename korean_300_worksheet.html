// 한글 음소 분해 함수 (초성, 중성, 종성)
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

function decomposeHangul(str) {
  let result = [];
  for (let ch of str) {
    let code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      let uni = code - 0xAC00;
      let c = Math.floor(uni / 588);
      let j = Math.floor((uni % 588) / 28);
      let jong = uni % 28;
      let s = CHO[c] + "+" + JUNG[j];
      if (jong > 0) s += "+" + JONG[jong];
      result.push(s);
    } else if (ch !== " ") {
      result.push(ch);
    }
  }
  return result;
}

// 1페이지당 10개씩 분할하여 30페이지 렌더링
const container = document.getElementById("workbook-container");
const wordsPerPage = 10;
const totalPages = Math.ceil(rawData.length / wordsPerPage); // 30페이지

for (let p = 0; p < totalPages; p++) {
  const pageDiv = document.createElement("div");
  pageDiv.className = "page";

  const startIdx = p * wordsPerPage;
  const endIdx = startIdx + wordsPerPage;
  const pageWords = rawData.slice(startIdx, endIdx);

  // 헤더
  const startChap = String(startIdx + 1).padStart(2, '0');
  const endChap = String(Math.min(endIdx, rawData.length)).padStart(2, '0');
  
  let pageHtml = `
    <div>
      <div class="header">
        <div class="header-title">외국인을 위한 한국어 기초 300 어휘 트레이싱 워크북</div>
        <div class="header-info">단원: Chapter ${startChap} ~ ${endChap} | 페이지 ${p + 1} / ${totalPages}</div>
      </div>
  `;

  // 10개 어휘 카드 렌더링
  pageWords.forEach(item => {
    const [num, eng, kor, pron, exEng, exKor] = item;
    const chapNum = "CH " + String(num).padStart(3, '0');

    // 대표 한글 단어 추출 (슬래시가 있는 경우 첫 단어 기준 분해)
    const primeKor = kor.split('/')[0].trim().replace(/ /g, '');
    const charList = primeKor.slice(0, 5).split(''); // 최대 5음절까지 열 표시
    const decompList = decomposeHangul(primeKor).slice(0, 5);

    // 트레이싱 테이블 헤더 및 셀 생성 (최대 5칸 + 반복 쓰기 칸)
    let thCells = '';
    let decompCells = '';
    let ghostCells = '';
    let freeCells = '';

    const maxCols = 5;
    for (let c = 0; c < maxCols; c++) {
      if (c < charList.length) {
        thCells += `<th style="width: ${(85/maxCols)}%;">${charList[c]}</th>`;
        decompCells += `<td style="font-size: 10px; color: #475569; font-weight: 500;">${decompList[c]}</td>`;
        ghostCells += `<td class="cross-grid trace-ghost">${charList[c]}</td>`;
        freeCells += `<td class="cross-grid trace-empty"></td>`;
      } else {
        // 단어 길이가 짧은 경우 복습 트레이싱 칸 배치
        let repeatChar = charList[c % charList.length] || '';
        thCells += `<th style="width: ${(85/maxCols)}%; color: #94a3b8;">복습</th>`;
        decompCells += `<td style="font-size: 10px; color: #cbd5e1;">-</td>`;
        ghostCells += `<td class="cross-grid trace-ghost">${repeatChar}</td>`;
        freeCells += `<td class="cross-grid trace-empty"></td>`;
      }
    }

    pageHtml += `
      <div class="word-unit">
        <div class="meta-row">
          <span class="chap-badge">${chapNum}</span>
          <span class="word-target">${kor}</span>
          <span class="word-eng">${eng}</span>
          <span class="word-pron">[${pron}]</span>
        </div>

        <table class="tracing-table">
          <tr>
            <th style="width: 15%;">구분</th>
            ${thCells}
          </tr>
          <tr>
            <th style="font-size: 8.5px;">자모 분해</th>
            ${decompCells}
          </tr>
          <tr>
            <th style="font-size: 8.5px;">따라 쓰기</th>
            ${ghostCells}
          </tr>
          <tr>
            <th style="font-size: 8.5px;">자율 쓰기</th>
            ${freeCells}
          </tr>
        </table>

        <div class="sentence-row">
          <span class="sent-label">예문</span>
          <span class="sent-eng" title="${exEng}">${exEng}</span>
          <span class="sent-ghost">${exKor}</span>
          <span class="sent-blank"></span>
        </div>
      </div>
    `;
  });

  pageHtml += `
    </div>
    <div class="footer">
      <span>Seoul National University Korean Language Study Material</span>
      <span>${p + 1} / ${totalPages}</span>
    </div>
  `;

  pageDiv.innerHTML = pageHtml;
  container.appendChild(pageDiv);
}
