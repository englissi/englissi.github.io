<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seoul Gomo Korean Learning</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background-color: #e0e7ff;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
    }
    .btn-secondary {
      background-color: #f8fafc;
      color: #334155;
      border-color: #e2e8f0;
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .btn-icon {
      font-size: 1.3rem;
    }
    .arrow {
      font-size: 1.1rem;
      opacity: 0.7;
    }
    .footer {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">🇰🇷 Learn Korean</span>
    <h1>Seoul Gomo Korean</h1>
    <p class="subtitle">Start your Korean learning journey with essential words and everyday expressions.</p>

    <div class="menu-list">
      <!-- Korean 300 words page -->
      <a href="korean1.html" class="btn btn-primary">
        <div class="btn-content">
          <span class="btn-icon">📖</span>
          <div>
            <div>300 Essential Words</div>
            <div style="font-size: 0.8rem; font-weight: 400; opacity: 0.85;">Pronunciation & audio examples</div>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <!-- Optional External Link -->
      <a href="https://google.com" target="_blank" class="btn btn-secondary">
        <div class="btn-content">
          <span class="btn-icon">🌐</span>
          <div>
            <div>Search More Resources</div>
            <div style="font-size: 0.8rem; font-weight: 400; color: #64748b;">External browser link</div>
          </div>
        </div>
        <span class="arrow">↗</span>
      </a>
    </div>

    <div class="footer">
      © Seoul Gomo Korean Learning. All rights reserved.
    </div>
  </div>

</body>
</html>
